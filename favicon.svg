<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Фавиконка сайта «Дмитров»: купол (город) над волнами реки Яхромы -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#3d5fe0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#sky)"/>
  <!-- солнце -->
  <circle cx="23" cy="19" r="5" fill="#ffffff" opacity="0.35"/>
  <!-- купол собора -->
  <path d="M25 35 a7 7 0 0 1 14 0 z" fill="#ffffff"/>
  <!-- волны реки -->
  <path d="M14 45 c4 -4 8 -4 12 0 s8 -4 12 0 s8 -4 12 0"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <path d="M14 53 c4 -4 8 -4 12 0 s8 -4 12 0"
        fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
</svg>